          - name: REDIS_SENTINEL_HOSTS
            value: golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local
          - name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_SERVICE
            value: mymaster
          - name: REDIS_PORT
            value: "6379"
          - name: REVERB_HOST
            value: metager.de
          - name: LOG_CHANNEL
            value: "stderr"
          - name: MATOMO_ENABLED
            value: "true"
          volumeMounts:
          - name: secrets
            mountPath: /metager/metager_app/.env
            subPath: ENV_PRODUCTION
            readOnly: true
          - name: mglogs-persistent-storage
            mountPath: /metager/metager_app/storage/metager
            readOnly: false
          - name: sqlite-databases
            mountPath: /metager/metager_app/database/databases
          - name: fast-logs
            mountPath: /metager/metager_app/storage/metager/fast_dir
      containers:
        - name: scheduler
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          image: "registry.metager.de/open-source/metager/fpm:golden"
          command: ["/usr/local/bin/php"]
          args: ["artisan", "schedule:work-mg"]
          imagePullPolicy: IfNotPresent
          env:
          - name: APP_ENV
            value: production
          - name: APP_URL
            value: https://metager.de
          
          - name: REDIS_HOST
            value: golden-valkey-master.metager.svc.cluster.local
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          
          - name: REDIS_SENTINEL_HOSTS
            value: golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local
          - name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_SERVICE
            value: mymaster
          - name: REDIS_PORT
            value: "6379"
          - name: REVERB_HOST
            value: metager.de
          - name: LOG_CHANNEL
            value: "stderr"
          - name: MATOMO_ENABLED
            value: "true"
          # More than the sidecar mounted (.env and the writable storage): this
          # container skips the image's normal entrypoint, so nothing ever falls
          # back to sumas.json.example the way it would there. requests:gather
          # does read the search configuration — it builds a SearchEngineRegistry
          # to read each engine's monthly-requests limit — so without this mount
          # every run of requests:gather threw "file_get_contents(...sumas.json):
          # No such file or directory" and exited 1 (GlitchTip METAGER-5/METAGER-6,
          # ~350 events each, every 15 minutes since the scheduler Deployment
          # split from the sidecar).
          volumeMounts:
          - name: secrets
            mountPath: /metager/metager_app/.env
            subPath: ENV_PRODUCTION
            readOnly: true
          - name: secrets
            mountPath: /metager/metager_app/config/sumas.json
            subPath: SUMAS_JSON
          - name: secrets
            mountPath: /metager/metager_app/config/suggestions.json
            subPath: SUGGESTIONS
          - name: secrets
            mountPath: /metager/metager_app/config/blacklistDomains.txt
            subPath: BLACKLIST_DOMAINS
          - name: secrets
            mountPath: /metager/metager_app/config/blacklistUrl.txt
            subPath: BLACKLIST_URL
          - name: secrets
            mountPath: /metager/metager_app/config/blacklistDescriptionUrl.txt
            subPath: BLACKLIST_DESCRIPTION_URL
          - name: mglogs-persistent-storage
            mountPath: /metager/metager_app/storage/metager
            readOnly: false
          - name: sqlite-databases
            mountPath: /metager/metager_app/database/databases
          - name: fast-logs
            mountPath: /metager/metager_app/storage/metager/fast_dir
          # As a sidecar this was an httpGet against port 8080 — nginx, in the same
          # network namespace. There is no HTTP server in this pod, so the same
          # check runs directly: schedule:healthcheck reads the heartbeat Redis key
          # that /health-check/liveness-scheduler reads, through the same class.
          #
          # The heartbeat is written every minute and tolerated for one, so a single
          # late run is absorbed here rather than by widening the check: three
          # consecutive misses, 30s apart, before a restart.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/php", "artisan", "schedule:healthcheck"]
            periodSeconds: 30
            failureThreshold: 3
          # No readinessProbe: nothing routes traffic here, and marking the only
          # scheduler "not ready" would achieve nothing but noise.
          startupProbe:
            exec:
              command: ["/usr/local/bin/php", "artisan", "schedule:healthcheck"]
            # schedule:work-mg writes its first heartbeat on the first run, which is
            # immediate, but the boot itself takes a moment.
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: node-role
          operator: Equal
          value: web

