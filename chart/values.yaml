# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: IfNotPresent
  fpm:
    repository: registry.metager.de/open-source/metager/fpm
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  nginx:
    repository: registry.metager.de/open-source/metager/nginx
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Overrides the name used to address the valkey subchart's resources (must match
# valkey.fullnameOverride below). Kept as a separate value because Kubernetes
# object names are capped at 63 chars and the subchart appends suffixes to its
# fullname without re-truncating. The longest is "-prestop-script" (15 chars, on
# the ConfigMap holding the Sentinel preStop hook), so anything set here must be
# 48 characters or fewer. See .gitlab/deployment_scripts/update_deployment.sh,
# which derives it from the release name.
valkeyName: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/configuration-snippet: >
      if ($arg_out = "results-with-style") {
        more_set_headers "X-Frame-Options: allow-from https://scripts.zdv.uni-mainz.de/";
      }
      if ($host = "www.metager.de") {
          return 301 https://metager.de$request_uri;
      }
      if ($host = "metager2.de") {
          return 301 https://metager.de$request_uri;
      }
      if ($host = "www.metager2.de") {
          return 301 https://metager.de$request_uri;
      }
      if ($host = "www.metager.org") {
          return 301 https://metager.org$request_uri;
      }
      if ($host = "metager.es") {
          return 301 https://metager.org/es-ES$request_uri;
      }
      if ($host = "www.metager.es") {
          return 301 https://metager.org/es-ES$request_uri;
      }
      if ($host = "metager.nl") {
          return 301 https://metager.org/nl-NL$request_uri;
      }
      if ($host = "www.metager.nl") {
          return 301 https://metager.org/nl-NL$request_uri;
      }
      if ($host = "metager.co.uk") {
          return 301 https://metager.org/en-GB$request_uri;
      }
      if ($host = "www.metager.co.uk") {
          return 301 https://metager.org/en-GB$request_uri;
      }
      if ($host = "www.metager3.de") {
          return 301 https://metager3.de$request_uri;
      }

    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/client-body-buffer-size: 30m
    nginx.ingress.kubernetes.io/client-header-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-buffers: 32 256k
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 256k;
      large_client_header_buffers 32 256k;
      underscores_in_headers on;
  hosts: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    fpm: {}
    scheduler: {}
    worker: {}
    nginx: {}
    reverb: {}
    queue: {}

# Queue workers run in their own Deployment (templates/deployment-queue.yaml) with a
# fixed replica count. They are not autoscaled: the HPA below watches CPU on the app
# pods, which tracks web traffic and says nothing about queue depth.
queue:
  replicaCount: 2

# Reverb runs in its own Deployment (templates/deployment-reverb.yaml) behind its own
# Service, with REVERB_SCALING_ENABLED=true so a broadcast arriving at any instance is
# fanned out to the others over Redis. That is what makes more than one replica safe.
reverb:
  replicaCount: 2
  # Long-lived websockets: let existing clients finish rather than cutting them all at
  # once on a rollout and inviting a reconnect storm.
  terminationGracePeriodSeconds: 300

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 85
  #targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Extra environment variables for every MetaGer container, as a name -> value map.
# A map, not a list: the templates iterate it with `range $name, $value`.
env: {}

# Valkey (cloudpirates/valkey), replacing the self-hosted redis-sentinel chart.
#
# This is a cache, not a store: nothing here survives a restart on purpose, which
# is why persistence and both on-disk formats stay off. Everything the app keeps
# in it — engine results, the loader_* object graphs, quicktips — is re-fetchable.
valkey:
  # Sentinel needs a quorum, so three. Anything less cannot fail over.
  architecture: replication
  replicaCount: 3

  sentinel:
    enabled: true
    # 2 of 3. Left at the chart default, stated here because it has to move with
    # replicaCount if that ever changes.
    quorum: 2
    # Matches config/database.php's REDIS_SENTINEL_SERVICE default. Stated rather
    # than inherited because _helpers.tpl reads it to set that env var, and the
    # two names have to agree or predis asks Sentinel for a master it never
    # monitors.
    masterName: mymaster
    masterProxy:
      # Not optional. The plain `<name>` Service selects every pod, replicas
      # included, so a client writing through it gets -READONLY roughly two times
      # in three. The retired chart avoided that with a sidecar that patched a
      # `role: master` label onto whichever pod Sentinel promoted, and a Service
      # selecting on it; this chart's equivalent is an HAProxy sidecar that
      # resolves the master by asking each backend directly, published as
      # `<name>-master`. That is what REDIS_HOST points at.
      #
      # It matters because most of the app talks to the `default` connection, not
      # the sentinel-aware one — REDIS_CACHE_CONNECTION is `default` in every
      # deployed environment, and the bare Redis:: facade calls on the search path
      # (rpush/brpop/lpush/expire in MetaGer, Searchengine, Suggestions) are all
      # writes.
      enabled: true

  auth:
    enabled: true

  persistence:
    enabled: false

  config:
    maxMemory: 5gb
    maxMemoryPolicy: allkeys-lru
    # Empty disables RDB snapshots; the chart renders `save ""` for this.
    save: ""
    # A list of raw valkey.conf lines, unlike the retired chart's key/value map.
    extraConfig:
      - appendonly no
      # Replicas sync from a socket rather than a dump file — there is no disk to
      # dump to, persistence being off.
      - repl-diskless-sync-delay 5
      - repl-diskless-sync-max-replicas 2
      - repl-diskless-load swapdb
      - repl-timeout 120
      - repl-backlog-size 512mb
      - shutdown-timeout 10

  # The retired chart ran a redis_exporter sidecar by default. Keep the metrics.
  metrics:
    enabled: true
