ingress:
  hosts:
    - host: metager3.de
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - metager3.de
      secretName: development-auto-deploy-tls
resources:
  requests:
    fpm:
      cpu: 1
      memory: 500M
    scheduler:
      cpu: 50m
      memory: 50M
    worker:
      cpu: 1
      memory: 100M
    queue:
      cpu: 50m
      memory: 50M
    nginx:
      cpu: 100m
      memory: 100M
    reverb:
      cpu: 50m
      memory: 50M
env:
  DB_CONNECTION: sqlite
  REDIS_CACHE_CONNECTION: default
  REDIS_CACHE_LOCK_CONNECTION: default
  REDIS_SESSION_CONNECTION: default
  SESSION_CONNECTION: default
  # GlitchTip (self-hosted, Sentry-protocol-compatible). The DSN is a public
  # identifier by design -- it ships in client-side JS regardless -- so it lives
  # here rather than in the ENV_PRODUCTION secret. Not set in review.yaml on
  # purpose: review apps are short-lived and would just add noise to project 36.
  SENTRY_LARAVEL_DSN: https://ada7fd926fac4b36b83c1292a95ec14f@errors.metager.de/36
  SENTRY_TRACES_SAMPLE_RATE: "0.01"

# One of everything. The chart defaults are sized for production — two queue
# workers, two Reverb instances and a three-node Valkey — and none of that buys
# anything on a single-user test deployment. It is the same cluster as
# production, so the spare pods are real reserved CPU and memory.
queue:
  replicaCount: 1

# Reverb is the one worth spelling out: production runs two so a rollout does not
# drop every websocket at once, and REVERB_SCALING_ENABLED fans a broadcast
# between them over Redis. With a single instance there is nothing to fan out to
# and the scaling flag is simply inert — it stays on so development still
# exercises the same code path that production runs.
reverb:
  replicaCount: 1

valkey:
  # Still `architecture: replication` with Sentinel on, because REDIS_HOST points
  # at the `-master` Service and the Valkey subchart only renders that Service
  # when Sentinel is enabled. Turning Sentinel off here would leave the app
  # pointing at a hostname that does not resolve.
  replicaCount: 1
  sentinel:
    # Has to move with replicaCount. The chart default is 2 (of 3); left at 2
    # against a single node, Sentinel could never reach quorum.
    quorum: 1
