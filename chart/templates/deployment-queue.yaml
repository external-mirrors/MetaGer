{{/*
Queue workers, on their own.

As a sidecar in the app Deployment these scaled with web traffic: the HPA watches
CPU across the app pods, which is dominated by fpm and nginx and says nothing
about how deep the queue is. A quiet night with a backlog of donation jobs got the
minimum number of workers; a traffic spike with an empty queue got the maximum.

Now a fixed count under .Values.queue.replicaCount. Fixed rather than autoscaled
because the useful signal is queue depth, which needs a metrics adapter this
cluster does not have — and a wrong signal is worse than none.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-queue
  labels:
    {{- include "chart.componentLabels" (dict "root" . "component" "queue") | nindent 4 }}
spec:
  replicas: {{ .Values.queue.replicaCount }}
  selector:
    matchLabels:
      {{- include "chart.componentSelectorLabels" (dict "root" . "component" "queue") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.componentLabels" (dict "root" . "component" "queue") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # queue:work finishes the job in hand on SIGTERM and then exits. Jobs here
      # send mail and talk to PayPal, so being killed part-way is worth avoiding.
      terminationGracePeriodSeconds: 120
      volumes:
        {{- include "chart.volumes" . | nindent 8 }}
      initContainers:
        {{- include "chart.migrateInitContainer" (dict "root" .) | nindent 8 }}
      containers:
        - name: queue
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "fpm_image" . }}"
          # Not php directly: queue-worker is a supervisor that runs
          # `artisan queue:work` in a loop (build/fpm/entrypoint/queue_worker.sh).
          #
          # --max-time recycles the *worker process* every 5 minutes. The point
          # is not memory: it is that this is a long-lived daemon holding one PDO
          # connection, and nothing inside a held connection can notice a
          # Postgres primary changing under it. After a CNPG failover the worker
          # keeps the socket to the old primary; the database queue driver opens
          # a transaction per pop(), and once Laravel's transaction counter
          # desyncs from PDO's state every subsequent pop() throws "There is
          # already an active transaction" forever — reported to GlitchTip once
          # a second, with pgrep still passing so k8s never restarts it (issue
          # 1387, the cluster outage of 2026-09-09).
          #
          # The supervisor is what keeps that recycle from being a container
          # restart. Run as the container's own process, the self-exit was paced
          # by CrashLoopBackOff like any other exit — 301s of work, then 81-95s
          # of backoff, measured in production on 2026-09-10. That is no worker
          # at all for ~22% of the time and ten restarts an hour per container,
          # reported as "Back-off restarting failed container" for a worker that
          # exited 0. Recycling inside the container costs neither.
          command: ["/usr/local/bin/queue-worker"]
          args: ["--backoff=60", "--tries=5", "--sleep=1", "--max-time=300", "--queue=donations,default,general"]
          imagePullPolicy: {{ .Values.image.fpm.pullPolicy }}
          env:
          {{- include "chart.env" (dict "root" .) | nindent 10 }}
          volumeMounts:
          {{- include "chart.mounts.env" . | nindent 10 }}
          {{- include "chart.mounts.config" . | nindent 10 }}
          {{- include "chart.mounts.storage" . | nindent 10 }}
          # pgrep only proves a worker process exists, not that it is draining
          # anything — a queue worker has no equivalent of the scheduler's
          # heartbeat to check against, and the wedge above does not stop the
          # worker's loop (pop() throws, gets reported, sleeps a second and
          # continues), so a probe hung off Looping would keep passing too.
          # Until one exists that keys off consecutive pop failures, the
          # --max-time recycle is what bounds an alive-but-wedged worker.
          #
          # Matches the worker process, not the supervisor: "queue-worker" does
          # not contain "queue:work", so this asks about the thing that does the
          # work. The sub-second gap between one worker exiting and the next
          # starting is covered by failureThreshold 3 at a 10s period.
          livenessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          readinessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          startupProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          resources:
            requests:
              {{- toYaml .Values.resources.requests.queue | nindent 14 }}
            limits:
        {{/*
        The broadcast queue, which the container above cannot serve.

        A worker serves exactly one queue connection, and that one serves the
        application default — `database`, i.e. Postgres, because
        QUEUE_CONNECTION is unset in the production .env. App\Events\KeyChanged
        deliberately does not go there: it is dispatched from the start page and
        the result page, neither of which needs a database for anything else,
        and pushing it onto the default connection put a synchronous Postgres
        INSERT on both (see config/broadcasting.php and
        tests/Feature/KeyChangedNeedsNoDatabaseTest). So it names its own
        connection and queue, and this is the worker that drains them. Without
        it the broadcasts are pushed and never run.

        The connection and queue names are the defaults in
        config/broadcasting.php (BROADCAST_QUEUE_CONNECTION,
        BROADCAST_QUEUE). They are a matched pair with that file and
        tests/assertions.sh checks they stay one.

        --tries=1 rather than the 5 next door: a balance update is worth
        delivering now or not at all, and retrying it with a 60s backoff would
        push a stale number at a browser up to five minutes late. Losing one
        costs a refresh, which is the trade this whole event is built on.
        */}}
        - name: queue-broadcasts
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "fpm_image" . }}"
          # --max-time, and the supervisor that absorbs it, for the same reasons
          # as the worker above — minus the PDO part: this one holds a Predis
          # connection through a Valkey failover instead.
          #
          # That wedge is fixed in the application now, not bounded here. The
          # `redis` queue connection has its own bounded Redis connection and is
          # built by App\Queue\FailoverRedisConnector, so a failover costs this
          # worker a reconnect inside one pop rather than up to five minutes of
          # undelivered balance updates (config/queue.php, config/database.php).
          # The recycle stays as the backstop for whatever that does not
          # anticipate — a broadcast worker has nothing in flight worth
          # protecting, so restarting it is close to free.
          command: ["/usr/local/bin/queue-worker"]
          args: ["redis", "--tries=1", "--sleep=1", "--max-time=300", "--queue=broadcasts"]
          imagePullPolicy: {{ .Values.image.fpm.pullPolicy }}
          env:
          {{- include "chart.env" (dict "root" .) | nindent 10 }}
          volumeMounts:
          {{- include "chart.mounts.env" . | nindent 10 }}
          # Same set as the worker beside it, deliberately. A broadcast job has
          # no use for sumas.json or the blacklists, but nothing stops a future
          # queued job landing here, and a container that differs from its
          # neighbour only in what it will crash on is not worth the saving.
          {{- include "chart.mounts.config" . | nindent 10 }}
          {{- include "chart.mounts.storage" . | nindent 10 }}
          # Containers in a pod do not share a PID namespace unless asked to, so
          # each of these two pgreps sees only its own worker.
          #
          # Still pgrep and not a progress probe, for the reason given next door:
          # a wedged worker's loop keeps running. What makes that acceptable here
          # rather than merely bounded is that this worker's only Redis call is a
          # pop that reconnects itself — see App\Queue\FailoverRedisQueue, and
          # Tests\Unit\QueueRedisConnectionTest for why pop() being the whole
          # loop is a pinned invariant and not an accident.
          livenessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          readinessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          startupProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          resources:
            requests:
              {{- toYaml .Values.resources.requests.queue | nindent 14 }}
            limits:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "chart.componentSelectorLabels" (dict "root" . "component" "queue") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
