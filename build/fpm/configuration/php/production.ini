memory_limit = 256M

; Do not expose php in production
expose_php = Off

; OP cache
opcache.enable=1
opcache.memory_consumption=128
; 8 was the default and it is not enough headroom here: a single startpage
; request interns 5.9 MB, and seven routes bring it to 6.0 of 8 — most of it the
; framework and vendor baseline, so it is spent before the result page renders
; anything. Filling the buffer is not an error, which is what makes it worth
; pre-empting: opcache simply stops interning and quietly loses the sharing.
; The cost of the extra 8 MB is 8 MB of shared memory per pod.
opcache.interned_strings_buffer=16
; 10000 is generous rather than arbitrary: a request loads 736 scripts, against
; 10873 PHP files in the tree. Measured, not assumed — most of vendor/ is never
; included.
opcache.max_accelerated_files=10000
opcache.max_wasted_percentage=5
opcache.validate_timestamps=1
opcache.revalidate_freq=300