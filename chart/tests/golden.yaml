# Source: chart/charts/valkey/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-valkey
  namespace: metager
  labels:
    app.kubernetes.io/instance: golden
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey
    app.kubernetes.io/version: 9.1.0
    helm.sh/chart: valkey-0.25.5
spec:
  replicas: 3
  revisionHistoryLimit: 10
  serviceName: golden-valkey-headless
  selector:
    matchLabels:
      app.kubernetes.io/instance: golden
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
        app.kubernetes.io/name: valkey
    spec:
      securityContext: 
        fsGroup: 1000
      serviceAccountName: default
      initContainers:
        - name: valkey-init
          image: docker.io/valkey/valkey:9.1.0-alpine3.23@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Get pod ordinal from hostname
              POD_ORDINAL=$(hostname | sed 's/.*-//')
              MY_HOSTNAME=$(hostname)

              # Create config file
              touch /tmp/valkey/valkey.conf

              echo "Pod ordinal: $POD_ORDINAL, hostname: $MY_HOSTNAME"
              # Add Valkey configurations for better Sentinel failover tolerance
              echo "" >> /tmp/valkey/valkey.conf
              echo "# Configurations for Kubernetes force deletion tolerance" >> /tmp/valkey/valkey.conf
              echo "min-slaves-to-write 0" >> /tmp/valkey/valkey.conf
              echo "min-slaves-max-lag 0" >> /tmp/valkey/valkey.conf

              # Try to determine current master from Sentinel (if any sentinel is available)
              CURRENT_MASTER=""
              SENTINEL_FOUND=false

              # Check if any sentinel is already running and knows the master
              for i in $(seq 0 2); do
                SENTINEL_HOST="golden-valkey-${i}.golden-valkey-headless"
                MASTER_INFO=$(valkey-cli -h "${SENTINEL_HOST}" -p 26379 -a "${VALKEY_PASSWORD}" sentinel get-master-addr-by-name mymaster 2>/dev/null | head -1 || echo "")
                if [ -n "$MASTER_INFO" ] && [ "$MASTER_INFO" != "Could not connect" ]; then
                  CURRENT_MASTER="$MASTER_INFO"
                  SENTINEL_FOUND=true
                  echo "Found current master from sentinel: $CURRENT_MASTER"
                  break
                fi
              done

              # Configuration logic
              if [ "$SENTINEL_FOUND" = true ] && [ -n "$CURRENT_MASTER" ]; then
                # Sentinel knows the master - configure accordingly
                MY_HOSTNAME=$(hostname)
                MY_HOSTNAME_FQDN="${MY_HOSTNAME}.golden-valkey-headless.metager.svc.cluster.local"
                # `hostname -i` does AF_INET-only lookups in BusyBox/musl and exits
                # non-zero on IPv6-only clusters; tolerate failure so `set -e`
                # doesn't abort the script. The IP is one of three master checks.
                MY_IP=$(hostname -i 2>/dev/null || echo "")

                # Check if I am the master by hostname or IP
                if [ "$MY_IP" = "$CURRENT_MASTER" ] || [ "$MY_HOSTNAME_FQDN" = "$CURRENT_MASTER" ] || [ "$MY_HOSTNAME" = "$CURRENT_MASTER" ]; then
                  echo "I am the current master according to Sentinel"
                else
                  echo "Configuring as replica of current master: $CURRENT_MASTER"
                  echo "replicaof $CURRENT_MASTER 6379" >> /tmp/valkey/valkey.conf
                  echo "masterauth ${VALKEY_PASSWORD}" >> /tmp/valkey/valkey.conf
                fi
              else
                # No sentinel available - use bootstrap logic
                if [ "$POD_ORDINAL" != "0" ]; then
                  echo "Bootstrap mode: configuring as replica of pod-0"
                  # Use hostname-based replication for better resilience
                  MASTER_HOSTNAME="golden-valkey-0.golden-valkey-headless"
                  echo "replicaof $MASTER_HOSTNAME 6379" >> /tmp/valkey/valkey.conf
                  echo "Bootstrap replica using pod-0 hostname: $MASTER_HOSTNAME"
                  echo "masterauth ${VALKEY_PASSWORD}" >> /tmp/valkey/valkey.conf
                else
                  echo "Bootstrap mode: pod-0 starting as initial master"
                fi
              fi

              # Configure for Sentinel discovery and force deletion tolerance
              
              echo "Using hostname: ${HOSTNAME}.golden-valkey-headless.metager.svc.cluster.local"
              echo "replica-announce-ip ${HOSTNAME}.golden-valkey-headless.metager.svc.cluster.local" >> /tmp/valkey/valkey.conf
              echo "replica-announce-port 6379" >> /tmp/valkey/valkey.conf
              echo "slave-announce-ip ${HOSTNAME}.golden-valkey-headless.metager.svc.cluster.local" >> /tmp/valkey/valkey.conf
              echo "slave-announce-port 6379" >> /tmp/valkey/valkey.conf

              # Make slaves more eligible for promotion during force deletions
              echo "slave-priority 100" >> /tmp/valkey/valkey.conf
              echo "replica-read-only yes" >> /tmp/valkey/valkey.conf
              # IMPORTANT: Always add masterauth for non-standalone architectures
              # Even if this pod starts as master, it may become a replica after failover
              # Without masterauth, REPLICAOF commands from sentinel will fail with NOAUTH
              echo "" >> /tmp/valkey/valkey.conf
              echo "# Authentication for replication (required for failover scenarios)" >> /tmp/valkey/valkey.conf
              echo "masterauth ${VALKEY_PASSWORD}" >> /tmp/valkey/valkey.conf

              # Add user provided settings at the end of file to ensure their precedence
              echo "" >> /tmp/valkey/valkey.conf
              # If there is existing config map or .Values.config value provided - use it
              if [ -f "/etc/valkey/valkey.conf" ]; then
                echo "# Content from provided config" >> /tmp/valkey/valkey.conf
                cat /etc/valkey/valkey.conf >> /tmp/valkey/valkey.conf
              else
                # Create minimal config if no config exists
                echo "# Default minimal config" >> /tmp/valkey/valkey.conf
                cat >> /tmp/valkey/valkey.conf << EOF
              bind 0.0.0.0
              port 6379
              EOF
              fi
              
              # Add masterauth for external replica if enabled (for replication without sentinel)
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-valkey
                  key: password
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
            - name: valkey-config
              mountPath: /tmp/valkey
      containers:
        - name: valkey
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          image: docker.io/valkey/valkey:9.1.0-alpine3.23@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              CONFIG_FILE="/tmp/valkey/valkey.conf"

              exec valkey-server "$CONFIG_FILE" --requirepass "${VALKEY_PASSWORD}"
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-valkey
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: golden-valkey
                  key: password
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli -h "127.0.0.1" ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli -h "127.0.0.1" ping  | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - /scripts/prestop.sh
          resources:
            {}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: valkey-config
              mountPath: /tmp/valkey
            - name: prestop-script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: sentinel
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          image: docker.io/valkey/valkey:9.1.0-alpine3.23@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
          imagePullPolicy: Always
          volumeMounts:
            - name: sentinel-config
              mountPath: /tmp
            - name: prestop-script
              mountPath: /scripts
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Wait for Valkey to be ready
              echo "Waiting for Valkey to start..."
              VALKEY_HOST="127.0.0.1"
              while ! valkey-cli -a "${VALKEY_PASSWORD}" -h "${VALKEY_HOST}" -p 6379 ping >/dev/null 2>&1; do
                sleep 1
              done
              echo "Valkey is ready"

              # Determine initial master: query existing Sentinels first, fallback to pod-0 only for bootstrap
              POD_ORDINAL=$(hostname | sed 's/.*-//')
              MASTER_HOST=""
              SENTINEL_FOUND_MASTER=false

              # First priority: Try to query other sentinels to find the current master
              echo "Checking existing Sentinels for current master..."
              for i in $(seq 0 2); do
                if [ "$i" != "$POD_ORDINAL" ]; then
                  SENTINEL_HOST="golden-valkey-${i}.golden-valkey-headless.metager.svc.cluster.local"
                  EXISTING_MASTER=$(valkey-cli -h "${SENTINEL_HOST}" -p 26379 -a "${VALKEY_PASSWORD}" sentinel get-master-addr-by-name mymaster 2>/dev/null | head -1 || echo "")
                  if [ -n "$EXISTING_MASTER" ] && [ "$EXISTING_MASTER" != "Could not connect" ]; then
                    MASTER_HOST="$EXISTING_MASTER"
                    SENTINEL_FOUND_MASTER=true
                    echo "Found current master via sentinel: $MASTER_HOST"
                    break
                  fi
                fi
              done

              # Second priority: If no Sentinels found master, check if any Valkey instance claims to be master
              if [ "$SENTINEL_FOUND_MASTER" = false ]; then
                echo "No Sentinels available, checking Valkey instances directly..."
                for i in $(seq 0 2); do
                  VALKEY_HOST="golden-valkey-${i}.golden-valkey-headless.metager.svc.cluster.local"
                  ROLE_INFO=$(valkey-cli -h "${VALKEY_HOST}" -p 6379 -a "${VALKEY_PASSWORD}" info replication 2>/dev/null | grep "role:master" || echo "")
                  if [ -n "$ROLE_INFO" ]; then
                    MASTER_HOST="$VALKEY_HOST"
                    echo "Found current master by role check: $MASTER_HOST"
                    break
                  fi
                done
              fi

              # Final fallback: Use pod-0 hostname for initial bootstrap only
              if [ -z "$MASTER_HOST" ]; then
                MASTER_HOST="golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local"
                echo "No existing master found, using pod-0 for initial bootstrap: $MASTER_HOST"
              fi

              # Create Sentinel config
              cat > /tmp/sentinel.conf << EOF
              port 26379
              bind * -::*
              # Enable hostname resolution for Valkey Sentinel
              sentinel resolve-hostnames yes
              sentinel announce-hostnames yes
              sentinel monitor mymaster ${MASTER_HOST} 6379 2
              sentinel down-after-milliseconds mymaster 1500
              sentinel failover-timeout mymaster 15000
              sentinel parallel-syncs mymaster 1
              sentinel auth-pass mymaster "${VALKEY_PASSWORD}"
              requirepass "${VALKEY_PASSWORD}"
              # Make automatic failover more aggressive for Kubernetes force deletions
              sentinel deny-scripts-reconfig yes
              # Fix leader election issues during force deletions
              protected-mode no
              # Allow sentinels to discover each other
              
              sentinel announce-ip ${HOSTNAME}.golden-valkey-headless.metager.svc.cluster.local
              sentinel announce-port 26379
              logfile ""
              loglevel notice
              EOF

              # Add known sentinels to help with discovery (using hostnames for resilience)
              for i in $(seq 0 2); do
                if [ "$i" != "$POD_ORDINAL" ]; then
                  SENTINEL_HOST="golden-valkey-${i}.golden-valkey-headless.metager.svc.cluster.local"
                  # Test if the host is resolvable before adding
                  if getent hosts "$SENTINEL_HOST" >/dev/null 2>&1; then
                    SENTINEL_IP=$(getent hosts "$SENTINEL_HOST" | awk '{print $1}' | head -1)
                    if [ -n "$SENTINEL_IP" ]; then
                      echo "sentinel known-sentinel mymaster ${SENTINEL_IP} 26379" >> /tmp/sentinel.conf
                    fi
                  fi
                fi
              done

              echo "Starting Sentinel with config:"
              cat /tmp/sentinel.conf

              exec valkey-sentinel /tmp/sentinel.conf
          ports:
            - name: sentinel
              containerPort: 26379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - valkey-cli -h "127.0.0.1" -p 26379 -a "${VALKEY_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-valkey
                  key: password
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - /scripts/prestop-sentinel.sh
          resources:
            {}
        - name: haproxy
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          image: docker.io/haproxy:3.4-alpine@sha256:fb87fc81943143b9acaea7442973e6ba654035fff76ffe7af6829dd1bcb0f7a5
          imagePullPolicy: IfNotPresent
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-valkey
                  key: password
          volumeMounts:
            - name: haproxy-config
              mountPath: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cat > /tmp/haproxy.cfg << 'EOF'
              global
                  maxconn 2000

              defaults
                  mode tcp
                  timeout connect 2s
                  timeout client 30s
                  timeout server 30s

              resolvers cluster_dns
                  parse-resolv-conf
                  hold valid 10s
                  hold other 30s
                  hold refused 30s
                  hold nx 30s
                  hold timeout 30s
                  hold obsolete 30s

              frontend valkey_master_fe
                  bind *:6380
                  use_backend valkey_master_strict if { nbsrv(valkey_master_strict) gt 0 }
                  default_backend valkey_master_any

              # Preferred: role:master, an attached replica, and not mid-failover.
              # Excludes a pod that self-declared master on restart before Sentinel
              # finished failing over (no replica ever attached to it), and one that
              # knows it's still in the middle of a handoff.
              backend valkey_master_strict
                  mode tcp
                  option tcp-check
                  tcp-check connect
                  tcp-check send "AUTH __VALKEY_PASSWORD__\r\n"
                  tcp-check expect string +OK
                  tcp-check send "PING\r\n"
                  tcp-check expect string +PONG
                  tcp-check send "INFO replication\r\n"
                  tcp-check expect string role:master min-recv 100
                  tcp-check expect rstring connected_slaves:[1-9][0-9]*
                  tcp-check expect string master_failover_state:no-failover
                  tcp-check send "QUIT\r\n"
                  tcp-check expect string +OK
                  server golden-valkey-0 golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local:6379 check inter 1s rise 2 fall 2 resolvers cluster_dns resolve-prefer ipv4 init-addr none
                  server golden-valkey-1 golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local:6379 check inter 1s rise 2 fall 2 resolvers cluster_dns resolve-prefer ipv4 init-addr none
                  server golden-valkey-2 golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local:6379 check inter 1s rise 2 fall 2 resolvers cluster_dns resolve-prefer ipv4 init-addr none

              # Fallback used only when no server qualifies for valkey_master_strict
              # (e.g. right after a fresh install, or a replica mid-resync). Keeps the
              # endpoint available instead of going dark, at the cost of trusting a
              # role:master answer on its own.
              backend valkey_master_any
                  mode tcp
                  option tcp-check
                  tcp-check connect
                  tcp-check send "AUTH __VALKEY_PASSWORD__\r\n"
                  tcp-check expect string +OK
                  tcp-check send "PING\r\n"
                  tcp-check expect string +PONG
                  tcp-check send "INFO replication\r\n"
                  tcp-check expect string role:master min-recv 100
                  tcp-check send "QUIT\r\n"
                  tcp-check expect string +OK
                  server golden-valkey-0 golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local:6379 check inter 1s rise 2 fall 2 resolvers cluster_dns resolve-prefer ipv4 init-addr none
                  server golden-valkey-1 golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local:6379 check inter 1s rise 2 fall 2 resolvers cluster_dns resolve-prefer ipv4 init-addr none
                  server golden-valkey-2 golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local:6379 check inter 1s rise 2 fall 2 resolvers cluster_dns resolve-prefer ipv4 init-addr none
              EOF
              ESCAPED_PASSWORD=$(printf '%s' "$VALKEY_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/[/&]/\\&/g')
              sed -i "s/__VALKEY_PASSWORD__/${ESCAPED_PASSWORD}/" /tmp/haproxy.cfg
              exec haproxy -f /tmp/haproxy.cfg -db
          ports:
            - name: haproxy
              containerPort: 6380
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: haproxy
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: haproxy
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {}
        - name: metrics
          image: "docker.io/oliver006/redis_exporter:v1.89.0-alpine@sha256:d4e0a0ad55fa4f968eea4519b518b16dac887debd06c790a6be2f60940538d82"
          imagePullPolicy: Always
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-valkey
                  key: password
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          livenessProbe:
            httpGet:
              path: /
              port: metrics
      volumes:
        - name: data
          emptyDir: {}
        - name: valkey-config
          emptyDir: {}
        - name: sentinel-config
          emptyDir: {}
        - name: prestop-script
          configMap:
            name: golden-valkey-prestop-script
            defaultMode: 0755
        - name: haproxy-config
          emptyDir: {}
        - name: config
          configMap:
            name: golden-valkey
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30

