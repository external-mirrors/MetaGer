fpm:
  stage: build_docker_images
  image: $BUILD_DOCKER_IMAGE
  needs:
    - composer
    - npm
  tags:
    - kubernetes
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # We need the vendor files in our final image. Make sure to not ignore the folder
    - echo '!metager/vendor' >> .dockerignore
  script:
    - docker build --network=host
      --target=production
      -f build/fpm/Dockerfile
      -t ${CI_REGISTRY_IMAGE}/$DOCKER_FPM_IMAGE_NAME:$DOCKER_FPM_IMAGE_TAG .
    - docker push ${CI_REGISTRY_IMAGE}/$DOCKER_FPM_IMAGE_NAME:$DOCKER_FPM_IMAGE_TAG
  after_script:
    - docker logout $CI_REGISTRY

nginx:
  stage: build_docker_images
  image: $BUILD_DOCKER_IMAGE
  needs:
    - npm
  tags:
    - kubernetes
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --network=host
      --target=production
      -f build/nginx/Dockerfile
      -t ${CI_REGISTRY_IMAGE}/$DOCKER_NGINX_IMAGE_NAME:$DOCKER_NGINX_IMAGE_TAG .
    - docker push ${CI_REGISTRY_IMAGE}/$DOCKER_NGINX_IMAGE_NAME:$DOCKER_NGINX_IMAGE_TAG
  after_script:
    - docker logout $CI_REGISTRY

# Keeps the registry from growing without bound. See cleanup_tags.sh for the
# policy; the short version is that a long-lived branch builds four images per
# push and only the last few deployed ones are worth keeping, and that a merged
# branch takes with it any chance of ever being swept again.
#
# `needs: []` rather than waiting on the builds: the script protects this
# pipeline's tags by name, whether or not they have been pushed yet, so there is
# nothing to wait for and no reason to sit on the critical path.
#
# REDIS_REPOSITORY_ID is gone with this: nothing has built a redis image since
# the cache moved to the valkey subchart, and no script ever read the variable —
# the 66 tags in that repository are all from branches that ended years ago.
.cleanup_registry:
  stage: build_docker_images
  tags:
    - kubernetes
  image: $DEPLOY_KUBERNETES_IMAGE
  needs: []
  variables:
    FPM_REPOSITORY_ID: 418
    NGINX_REPOSITORY_ID: 416
    NODE_REPOSITORY_ID: 419
    KEEP_N: 9 # Deployed revisions to keep, so a rollback has somewhere to go
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:metager
  script:
    - .gitlab/deployment_scripts/cleanup_tags.sh

cleanup_registry_review:
  extends:
    - .cleanup_registry
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: "https://${CI_COMMIT_REF_SLUG}.review.metager.de"
    action: prepare
    auto_stop_in: 2 days
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "development"'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

cleanup_registry_development:
  extends:
    - .cleanup_registry
  environment:
    name: development
    url: https://metager3.de
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH != "development"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "development"'

cleanup_registry_production:
  extends:
    - .cleanup_registry
  environment:
    name: production
    url: https://metager.de
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH != "master"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
