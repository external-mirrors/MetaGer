ingress:
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns
  hosts:
    - paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - "*.review.metager.de"
      secretName: review-tls

# Gateway API parity for the still-live Ingress above -- see chart/values.yaml
# for the full explanation. Testing here first: cheapest blast radius of the
# three environments, and CI recreates a fresh review app end to end on every
# push, so a bad template is caught by opening/updating a merge request rather
# than by a production deploy. hosts[0] is set at deploy time
# (update_deployment.sh --set gatewayAPI.hosts[0]), same as ingress.hosts[0].host.
# sectionName is fixed because every review app shares one wildcard Gateway
# listener (*.review.metager.de) rather than getting its own.
gatewayAPI:
  enabled: true
  sectionName: review-metager-de
  hosts: []

autoscaling:
  enabled: false

env:
  DB_CONNECTION: sqlite
  REDIS_CACHE_CONNECTION: default
  REDIS_CACHE_LOCK_CONNECTION: default
  REDIS_SESSION_CONNECTION: default
  SESSION_CONNECTION: default

# One of everything, same as development.yaml: the chart defaults are sized for
# production and a review app is a single-user throwaway deployment.
queue:
  replicaCount: 1

reverb:
  replicaCount: 1

valkey:
  replicaCount: 1
  sentinel:
    quorum: 1
  # See development.yaml: the base chart's minAvailable: 2 is sized for
  # production and does not move with replicaCount, so a single pod can
  # never satisfy it and a node drain hits an unclearable PDB.
  pdb:
    enabled: false
