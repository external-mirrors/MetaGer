server {
    listen       8080;
    server_name  localhost;
    root   /metager/metager_app/public;
    index  index.php index.html index.htm;

    client_max_body_size 30M;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto 'https';
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    location ~ web.config$ {
        return 404 "Not Found";
    }
    location ~ \.htaccess$ {
        return 404 "Not Found";
    }

    location /health-check/nginx {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Answered by PHP-FPM's own ping handler (see www_01_production.conf),
    # inside a worker but before Laravel boots — no Redis, no Postgres, no
    # app code runs. Liveness/readiness used to hit /health-check/liveness,
    # a full Laravel route that could fail for reasons unrelated to whether
    # the pod can serve traffic at all.
    location = /health-check/liveness {
        access_log off;
        fastcgi_pass localhost:9000;
        include fastcgi_params;
        # FPM matches ping.path against SCRIPT_NAME *and* SCRIPT_FILENAME —
        # both, confirmed against a bare php-fpm (setting only one 404s).
        # fastcgi_params sets both from the request URI/document root, so
        # both have to be overridden after the include, not before.
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
    }

    location ~ "^(/.*)?/keys" {
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        proxy_pass http://keymanager-main.keymanager:80; # IP Adress is statically set in keymanager project for dev
    }

        # HMR WebSocket for webpack-dev-server
    location ^~ /proxy/ws {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/ws;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # VNC WebSocket endpoint for noVNC
    location ^~ /proxy/browser-streaming {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-streaming;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Audio WebSocket endpoint for noVNC
    location ^~ /proxy/browser-audio {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-audio;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Touch input WebSocket endpoint (touch-mode sessions on phones/tablets)
    location ^~ /proxy/browser-touch {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-touch;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # App WebSocket endpoint
    location ^~ /proxy/browser-session {
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-session;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Match /proxy, /de-DE/proxy, /proxy/abc, etc., but NOT /keys or /keys/*
    location ~ "^(/[^/]+)?/proxy(/.*)?$" {
        add_header X-Debug-Location proxy-regex;
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        proxy_pass http://master-safebrowse.safebrowse; # IP Adress is statically set in Browser manager project for dev
    }

    # Websocket routing lives in the ingress now, not here.
    #
    # These two locations used to proxy /ws/app and /apps/{id}/events to
    # 127.0.0.1:8081 — the Reverb sharing this pod. Reverb has its own Deployment
    # and Service, so the ingress sends both paths straight to it and nothing in
    # this pod listens on 8081 any more. See chart/templates/ingress-reverb.yaml.
    #
    # The development config still proxies them, because compose has no ingress:
    # there, nginx forwarding to the `reverb` service container is the equivalent
    # arrangement.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header "Content-Security-Policy" $csp;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_buffer_size    256k;
        fastcgi_buffers     32 256k;
        fastcgi_pass localhost:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 900;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        add_header "Content-Security-Policy" $csp;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}