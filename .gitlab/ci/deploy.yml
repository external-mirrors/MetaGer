.deploy:
  stage: deploy
  image: $DEPLOY_KUBERNETES_IMAGE
  needs:
    - fpm
    - nginx
  dependencies: [] # No Artifacts required
  # Helm takes a lock per release, and two pipelines upgrading the same release
  # at once means the second one fails with "another operation (install/upgrade/
  # rollback) is in progress" — which is what happens when two commits land a
  # minute apart. A resource group serialises them instead.
  resource_group: helm-$CI_COMMIT_REF_SLUG
  # Not interruptible, unlike everything else. Cancelling a helm upgrade midway
  # is how a release ends up wedged in a pending state, and the auto-cancel this
  # opts out of exists to save build minutes, not to race a deploy.
  interruptible: false
  variables:
    DEPLOYMENT_CHART_NAME: ${CI_COMMIT_REF_SLUG}
    BRANCH_NAME: $CI_COMMIT_REF_NAME
    COMMIT_NAME: $CI_COMMIT_REF_SLUG
  tags:
    - kubernetes
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:metager
  script:
    - .gitlab/deployment_scripts/update_secret.sh
    - .gitlab/deployment_scripts/update_deployment.sh

deploy_development:
  extends:
    - .deploy
  tags:
    - kubernetes
  environment:
    name: development
    url: https://metager3.de
    action: start
  variables:
    DEPLOYMENT_URL: "metager3.de"
    DEPLOYMENT_HELM_VALUES: .gitlab/development.yaml
    DEPLOYMENT_CHART_NAME: $CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

deploy_production:
  extends:
    - .deploy
  tags:
    - kubernetes
  environment:
    name: production
    url: https://metager.de
    action: start
  variables:
    DEPLOYMENT_URL: "metager.de"
    DEPLOYMENT_HELM_VALUES: .gitlab/production.yaml
    DEPLOYMENT_CHART_NAME: $CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy_review:
  extends:
    - .deploy
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    url: "https://${CI_COMMIT_REF_SLUG}.review.metager.de"
    action: start
    on_stop: stop_review
    auto_stop_in: 2 days
  variables:
    DEPLOYMENT_URL: "${CI_COMMIT_REF_SLUG}.review.metager.de"
    DEPLOYMENT_HELM_VALUES: .gitlab/review.yaml
    DEPLOYMENT_CHART_NAME: review-${CI_COMMIT_REF_SLUG}
    BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "development"'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# Runs when the review environment is torn down — on `auto_stop_in`, and when
# the merge request is merged and its branch deleted. That last case is the one
# that matters for the registry: after it, nothing is left that could ever sweep
# this ref again, so this is the last chance to delete its images.
stop_review:
  stage: deploy
  image: $DEPLOY_KUBERNETES_IMAGE
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    action: stop
  resource_group: helm-$CI_COMMIT_REF_SLUG
  interruptible: false
  variables:
    DEPLOYMENT_CHART_NAME: review-${CI_COMMIT_REF_SLUG}
    FPM_REPOSITORY_ID: 418
    NGINX_REPOSITORY_ID: 416
    # Was missing, so the node images were invisible to the teardown and stayed
    # behind for good. 163 of the 186 tags in that repository got there this way.
    NODE_REPOSITORY_ID: 419
  before_script:
    - kubectl config get-contexts
    - kubectl config use-context $CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:metager
  script:
    - .gitlab/deployment_scripts/delete_deployment.sh
  when: manual
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "development"'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
