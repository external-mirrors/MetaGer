apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-app
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        {{- include "chart.volumes" . | nindent 8 }}
      containers:
        - name: fpm
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "fpm_image" . }}"
          imagePullPolicy: {{ .Values.image.fpm.pullPolicy }}
          env:
          {{- include "chart.env" (dict "root" . "appUrl" true) | nindent 10 }}
          volumeMounts:
          {{- include "chart.mounts.env" . | nindent 10 }}
          {{- include "chart.mounts.config" . | nindent 10 }}
          {{- include "chart.mounts.storage" . | nindent 10 }}
          # ports removed: only nginx exposes 'http'
          livenessProbe:
            httpGet:
              path: /health-check/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /health-check/liveness
              port: 8080
          startupProbe:
            tcpSocket:
              port: 9000
            failureThreshold: 60
            periodSeconds: 1
          resources:
            requests:
              {{- toYaml .Values.resources.requests.fpm | nindent 14 }}
            limits: {}
        - name: scheduler
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "fpm_image" . }}"
          command: ["/usr/local/bin/php"]
          args: ["artisan", "schedule:work-mg"]
          imagePullPolicy: {{ .Values.image.fpm.pullPolicy }}
          env:
          {{- include "chart.env" (dict "root" . "appUrl" true) | nindent 10 }}
          volumeMounts:
          {{- include "chart.mounts.env" . | nindent 10 }}
          {{- include "chart.mounts.storage" . | nindent 10 }}
          # ports removed: only nginx exposes 'http'
          livenessProbe:
            httpGet:
              path: /health-check/liveness-scheduler
              port: 8080
          readinessProbe:
            httpGet:
              path: /health-check/liveness-scheduler
              port: 8080
          startupProbe:
            httpGet:
              path: /health-check/liveness-scheduler
              port: 8080
          resources:
            requests:
              {{- toYaml .Values.resources.requests.scheduler | nindent 14 }}
            limits: {}
        - name: queue
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "fpm_image" . }}"
          command: ["/usr/local/bin/php"]
          args: ["artisan", "queue:work", "--backoff=60", "--tries=5", "--sleep=1", "--queue=donations,default,general"]
          imagePullPolicy: {{ .Values.image.fpm.pullPolicy }}
          env:
          {{- include "chart.env" (dict "root" .) | nindent 10 }}
          volumeMounts:
          {{- include "chart.mounts.env" . | nindent 10 }}
          {{- include "chart.mounts.config" . | nindent 10 }}
          {{- include "chart.mounts.storage" . | nindent 10 }}
          livenessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          readinessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          startupProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          resources:
            requests:
              {{- toYaml .Values.resources.requests.queue | nindent 14 }}
            limits:
        - name: reverb
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "fpm_image" . }}"
          command: ["/usr/local/bin/php"]
          args: ["artisan", "reverb:start", "--port=8081", "--debug"]
          imagePullPolicy: {{ .Values.image.fpm.pullPolicy }}
          env:
          {{- include "chart.env" (dict "root" .) | nindent 10 }}
          volumeMounts:
          {{- include "chart.mounts.env" . | nindent 10 }}
          ports:
            - name: reverb
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            exec:
              command:
              - pgrep
              - -f
              - reverb:start
          readinessProbe:
            exec:
              command:
              - pgrep
              - -f
              - reverb:start
          startupProbe:
            exec:
              command:
              - pgrep
              - -f
              - reverb:start
          resources:
            requests:
              {{- toYaml .Values.resources.requests.reverb | nindent 14 }}
            limits:
        - name: nginx
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ template "nginx_image" . }}"
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health-check/nginx
              port: http
          readinessProbe:
            httpGet:
              path: /health-check/nginx
              port: http
          startupProbe:
            httpGet:
              path: /health-check/nginx
              port: http
            failureThreshold: 60
            periodSeconds: 1
          resources:
            requests:
              {{- toYaml .Values.resources.requests.nginx | nindent 14 }}
            limits: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}-app
                topologyKey: kubernetes.io/hostname
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}