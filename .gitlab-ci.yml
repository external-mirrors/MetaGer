default:
  tags:
    - kubernetes
  # Superseded pipelines are the whole reason the registry cleanup had to grow a
  # guard: two pipelines on one ref, and the older one deletes images the newer
  # one has just pushed and not yet deployed. The guard stops that being an
  # outage; this stops it happening. Every job is interruptible by default and
  # the deploy jobs opt back out, so a new commit cancels the build and test
  # work but never a helm upgrade that has already started.
  interruptible: true
variables:
  DOCKER_HOST: "tcp://docker-dind.gitlab-suma:2375"
  BUILD_DOCKER_IMAGE: docker:24.0.5
  DEPLOY_KUBERNETES_IMAGE: alpine/k8s:1.32.8
  DOCKER_FPM_IMAGE_NAME: fpm
  DOCKER_NGINX_IMAGE_NAME: nginx
  DOCKER_NODE_IMAGE_NAME: node
  KUBE_NAMESPACE: metager-2

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "development") || ($CI_PIPELINE_SOURCE == 'web' && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_BRANCH != "development")
      variables:
        APP_URL: "https://${DOCKER_IMAGE_TAG_PREFIX}.review.metager.de"
        APP_ENV: development
        DOCKER_IMAGE_TAG_PREFIX: $CI_COMMIT_REF_SLUG
        DOCKER_COMPOSER_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-composer-$CI_COMMIT_SHA
        DOCKER_FPM_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        DOCKER_NGINX_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        DOCKER_NODE_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        HELM_RELEASE_NAME: review-$DOCKER_IMAGE_TAG_PREFIX
    - if: $CI_COMMIT_BRANCH == "master"
      variables:
        APP_URL: https://metager.de
        APP_ENV: production
        DOCKER_IMAGE_TAG_PREFIX: $CI_COMMIT_BRANCH
        DOCKER_COMPOSER_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-composer-$CI_COMMIT_SHA
        DOCKER_FPM_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        DOCKER_NGINX_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        DOCKER_NODE_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        HELM_RELEASE_NAME: $DOCKER_IMAGE_TAG_PREFIX
    - if: $CI_COMMIT_BRANCH == "development"
      variables:
        APP_URL: https://metager3.de
        APP_ENV: development
        DOCKER_IMAGE_TAG_PREFIX: $CI_COMMIT_BRANCH
        DOCKER_COMPOSER_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-composer-$CI_COMMIT_SHA
        DOCKER_FPM_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        DOCKER_NGINX_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        DOCKER_NODE_IMAGE_TAG: $DOCKER_IMAGE_TAG_PREFIX-$CI_COMMIT_SHA
        HELM_RELEASE_NAME: $DOCKER_IMAGE_TAG_PREFIX

stages:
  - build_dependency_images
  - build_dependencies
  - build_docker_images
  - deploy
  - integrationtest

include:
  - local: /.gitlab/ci/chart.yml
  - local: /.gitlab/ci/deployment_scripts.yml
  - local: /.gitlab/ci/build_dependency_images.yml
  - local: /.gitlab/ci/build_dependencies.yml
  - local: /.gitlab/ci/build_docker_images.yml
  - local: /.gitlab/ci/deploy.yml
  - local: /.gitlab/ci/integrationtest.yml
