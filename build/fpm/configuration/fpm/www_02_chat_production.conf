; Dedicated FPM pool for the LLM chat message route (production).
;
; Why a separate pool at all: a chat message holds a worker for the *entire* generation — tens of
; seconds, sometimes more. The [www] pool is sized and timed for fast search request/response
; cycles, and shares its 100 workers with all search traffic. Putting chat there means a burst of
; slow generations can starve search, and — decisively — [www] sets
; request_terminate_timeout = 30, which would hard-kill every generation that runs longer than
; half a minute. That timeout is correct for search and must stay; chat simply cannot live under
; it.
;
; Note this is not a streaming-only concern: MetaGer's chat UI works without client JS, and that
; no-JS path is a buffered POST that occupies a worker for the full generation just the same.
;
; See MetaGer/docs/llm/metager-integration/native-frontend.md §"Routing".
[chat]

access.log = /dev/null

; Mirrors the base image's [www] pool (php-fpm.d/www.conf). Ignored with a notice when FPM runs
; as non-root, which it does here — kept for parity so the two pools differ only where intended.
user = www-data
group = www-data

; Port 9001; [www] stays on 9000. nginx routes only the chat message location here.
listen = 9001

; Same as the base image's docker.conf applies to [www] — pool sections don't inherit it.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
; Bounded on purpose. The point of this pool is that chat cannot consume unbounded workers; the
; 21st concurrent message should queue rather than degrade the rest of the site. Whether 20 is
; right needs real usage data — see MetaGer/docs/llm/open-questions.md.
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Bounded, but far above any legitimate generation — not 0. A truly stuck worker (dead upstream
; that never closes the socket) must still be reclaimed eventually; this just has to sit above the
; slowest real generation. Matches nginx's fastcgi_read_timeout for the chat location.
request_terminate_timeout = 900

; Streaming requires PHP to hand bytes to nginx as they arrive. php.ini ships
; output_buffering = 4096, which would hold the first 4KB of a token stream — long enough to
; swallow an entire short answer. Disabled here only, so search keeps its buffering.
php_admin_value[output_buffering] = 0
php_admin_value[zlib.output_compression] = 0

; max_execution_time only counts CPU time in the script itself, not time blocked reading an
; upstream socket, so it would rarely fire here — set explicitly anyway so the pool's behaviour
; doesn't depend on that subtlety.
php_admin_value[max_execution_time] = 0
