# Source: chart/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golden
  labels:
    helm.sh/chart: chart-0.1.0
    app.kubernetes.io/name: golden-app
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
    app: golden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/client-body-buffer-size: 30m
    nginx.ingress.kubernetes.io/client-header-buffer-size: 256k
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($arg_out = "results-with-style") {
        more_set_headers "X-Frame-Options: allow-from https://scripts.zdv.uni-mainz.de/";
      } if ($host = "www.metager.de") {
          return 301 https://metager.de$request_uri;
      } if ($host = "metager2.de") {
          return 301 https://metager.de$request_uri;
      } if ($host = "www.metager2.de") {
          return 301 https://metager.de$request_uri;
      } if ($host = "www.metager.org") {
          return 301 https://metager.org$request_uri;
      } if ($host = "metager.es") {
          return 301 https://metager.org/es-ES$request_uri;
      } if ($host = "www.metager.es") {
          return 301 https://metager.org/es-ES$request_uri;
      } if ($host = "metager.nl") {
          return 301 https://metager.org/nl-NL$request_uri;
      } if ($host = "www.metager.nl") {
          return 301 https://metager.org/nl-NL$request_uri;
      } if ($host = "metager.co.uk") {
          return 301 https://metager.org/en-GB$request_uri;
      } if ($host = "www.metager.co.uk") {
          return 301 https://metager.org/en-GB$request_uri;
      } if ($host = "www.metager3.de") {
          return 301 https://metager3.de$request_uri;
      }
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    nginx.ingress.kubernetes.io/proxy-buffers: 32 256k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 256k;
      large_client_header_buffers 32 256k;
      underscores_in_headers on;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "metager.de"
      secretName: metager-tls
  rules:
    - host: "metager.de"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golden
                port:
                  number: 80
          # The Laravel backend POSTs broadcasts to https://{REVERB_HOST}/apps/{id}/events.
          # It used to land on the app's nginx, which proxied to the Reverb in its own
          # pod; now it goes straight to the Reverb Service, and Redis scaling fans the
          # message out to every instance. No rewrite here on purpose — Reverb serves
          # this path as-is, which is why /ws lives on its own Ingress.
          - path: /apps
            pathType: Prefix
            backend:
              service:
                name: golden-reverb
                port:
                  number: 8081
          - path: /wsb
            pathType: Prefix
            backend:
              service:
                name: wsb
                port:
                  number: 80
