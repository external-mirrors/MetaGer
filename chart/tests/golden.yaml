apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-redis-sentinel-scripts
  labels:
    helm.sh/chart: redis-sentinel-0.1.5
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "8.2.1"
    app.kubernetes.io/managed-by: Helm
data:
  entrypoint-redis.sh: |
    #!/usr/bin/env bash
    set -e

    export REDIS_HOSTNAME=$(cat /etc/hostname).golden-redis-sentinel-headless
    mkdir -p /usr/local/etc/redis
    touch /usr/local/etc/redis/redis.conf

    if [[ -f /usr/local/etc/redis/redis-default.conf ]]; then
        cat /usr/local/etc/redis/redis-default.conf >> /usr/local/etc/redis/redis.conf
    fi

    if [[ -f /usr/local/etc/redis/redis-extra.conf ]]; then
        cat /usr/local/etc/redis/redis-extra.conf >> /usr/local/etc/redis/redis.conf
    fi

    echo "replica-announce-ip $REDIS_HOSTNAME" >> /usr/local/etc/redis/redis.conf
    echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf
    echo "masterauth $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf

    COUNTER=0
    while (( COUNTER < 10 )); do
        echo "Waiting for master information from Sentinel..."
        
        set +e
        readarray -t MASTER <<<$(redis-cli -p 26379 -a $SENTINEL_PASSWORD --raw sentinel get-master-addr-by-name mymaster)
        set -e
        ((COUNTER++)) || true
        if [[ ${#MASTER[@]} == 2 ]]; then
            break
        else
            sleep 1
        fi
    done

    if (( COUNTER >= 9 )); then
        echo "Failed to get master information from Sentinel"
        exit 1
    fi

    if [[ ${MASTER[0]} != $REDIS_HOSTNAME ]]; then
        echo "replicaof ${MASTER[0]} ${MASTER[1]}" >> /usr/local/etc/redis/redis.conf
    fi

    exec /usr/local/bin/docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf
  entrypoint-sentinel.sh: |
    #!/usr/bin/env bash
    set -e

    export REDIS_HOSTNAME=$(cat /etc/hostname).golden-redis-sentinel-headless
    SENTINEL_HOSTNAME=golden-redis-sentinel

    mkdir -p /usr/local/etc/redis

    set +e
    [ -f /data/sentinel.conf ]
    FIRST_START=$?
    set -e

    touch /data/sentinel.conf
    chmod 660 /data/sentinel.conf

    if [[ -f /usr/local/etc/redis/sentinel-default.conf ]]; then
        cat /usr/local/etc/redis/sentinel-default.conf >> /data/sentinel.conf
    fi

    if [[ -f /usr/local/etc/redis/sentinel-extra.conf ]]; then
        cat /usr/local/etc/redis/sentinel-extra.conf >> /data/sentinel.conf
    fi

    echo "requirepass $SENTINEL_PASSWORD" >> /data/sentinel.conf
    echo "SENTINEL announce-ip $REDIS_HOSTNAME" >> /data/sentinel.conf
    echo "SENTINEL auth-pass mymaster $REDIS_PASSWORD" >> /data/sentinel.conf

    MASTER=()

    # First check for an existing master
    set +e
    REDIS_RESPONSE=$(redis-cli -p 26379 -h $SENTINEL_HOSTNAME -a $SENTINEL_PASSWORD --raw sentinel get-master-addr-by-name mymaster)
    if [[ $? == 0 ]]; then
    readarray -t MASTER <<<$REDIS_RESPONSE
    fi
    set -e

    if (( FIRST_START == 1 )); then
        echo "First start of Sentinel, trying to discover master..."
        # On first start, append the monitor line at the start of the file
        if [[ ${#MASTER[@]} == 2 ]]; then
            sed -i "1s/^/SENTINEL monitor mymaster ${MASTER[0]} ${MASTER[1]} 2\n/" /data/sentinel.conf
        elif [[ $HOSTNAME == "golden-redis-sentinel-0" ]]; then
          echo "No master found, starting with first ordinal as master"
          MASTER[0]=golden-redis-sentinel-0.golden-redis-sentinel-headless
          MASTER[1]=6379
          sed -i "1s/^/SENTINEL monitor mymaster ${MASTER[0]} ${MASTER[1]} 2\n/" /data/sentinel.conf
        else
            echo "No master found, not starting"
            exit 1
        fi
    fi

    # Update the current master file
    if [[ ${#MASTER[@]} == 2 ]]; then
      echo ${MASTER[0]} > /shared/current-master
    fi

    chown -R redis:redis /data
    chown -R redis:redis /shared

    exec /usr/local/bin/docker-entrypoint.sh redis-sentinel /data/sentinel.conf
  prestop.sh: |
    #!/usr/bin/env bash
    set -e

    export REDIS_HOSTNAME=$(cat /etc/hostname).golden-redis-sentinel-headless
    SENTINEL_HOSTNAME=golden-redis-sentinel

    set +e
    REDIS_RESPONSE=$(redis-cli -p 26379 -h $SENTINEL_HOSTNAME -a $SENTINEL_PASSWORD --raw sentinel get-master-addr-by-name mymaster)
    if [[ $? == 0 ]]; then
    readarray -t MASTER <<<$REDIS_RESPONSE
    fi
    set -e

    if (( ${#MASTER[@]} == 2 )) && [[ ${MASTER[0]} == "${HOSTNAME}."* ]]; then
        echo "Current node is master, promoting another replica to master"
        redis-cli -p 26379 -h $SENTINEL_HOSTNAME -a $SENTINEL_PASSWORD sentinel failover mymaster
        sleep 5
    fi
  prestop-sentinel.sh: |
    #!/usr/bin/env bash
    set -e

    export REDIS_HOSTNAME=$(cat /etc/hostname).golden-redis-sentinel-headless

    # Wait until this redis node has quit
    echo "Waiting until redis node has quit..."
    while true; do
      redis-cli -p 6379 -h $REDIS_HOSTNAME -a $REDIS_PASSWORD ping > /dev/null 2>&1
      if [[ $? != 0 ]]; then
        break
      fi
      sleep 1
    done
  failover.sh: |
    #!/usr/bin/env bash
    set -e

    # This script is called by sentinel whenever a failover happened
    NEW_MASTER=$6

    echo "New master is $NEW_MASTER"
    echo $NEW_MASTER > /shared/current-master
  update-master.sh: |
    #!/usr/bin/env bash
    set -e

    trap 'SIGTERM' sigterm

    MASTER=""

    while true; do
      if [[ ! -f /shared/current-master ]]; then
        sleep 5
        continue
      fi
      mapfile -n1 -t < /shared/current-master CURRENT_MASTER
      if [[ "$CURRENT_MASTER" != "$MASTER" ]]; then
        echo "New master is $CURRENT_MASTER"
        echo "Updating labels on this pod"
        MASTER=$CURRENT_MASTER
        if [[ $MASTER == $HOSTNAME.* ]]; then
          echo "Setting label role to master"
          kubectl label pod $HOSTNAME role=master --overwrite
        else
          echo "Setting label role to replica"
          kubectl label pod $HOSTNAME role=replica --overwrite
        fi
      fi
      sleep 5
    done

    sigterm() {
      echo "Caught SIGTERM signal!"
      exit 0
    }
