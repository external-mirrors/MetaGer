npm:
  stage: build_dependencies
  image: ${CI_REGISTRY_IMAGE}/$DOCKER_NODE_IMAGE_NAME:$DOCKER_NODE_IMAGE_TAG
  tags:
    - kubernetes
  script:
    - cd metager
    - npm install --cache .npm --prefer-offline --no-audit
    # Vitest runs here rather than in its own job: this is the only job with node_modules
    # installed, and a failing frontend test should stop the pipeline before the images build.
    - npm test
    - npm run build
  needs:
    - node_image
  artifacts:
    paths:
      - metager/public
    expire_in: 2 hrs
  cache:
    paths:
      - metager/.npm/

composer:
  stage: build_dependencies
  image: ${CI_REGISTRY_IMAGE}/$DOCKER_FPM_IMAGE_NAME:$DOCKER_COMPOSER_IMAGE_TAG
  tags:
    - kubernetes
  before_script:
    - export COMPOSER_HOME=$(pwd)/metager/.composer
  script:
    - cd metager
    - echo $COMPOSER_HOME
    - composer install --optimize-autoloader --no-dev
  artifacts:
    paths:
      - metager/vendor
    expire_in: 2 hrs
  cache:
    paths:
      - metager/.composer/
