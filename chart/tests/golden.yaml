# Source: chart/templates/deployment-queue.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-queue
  labels:
    helm.sh/chart: chart-0.1.0
    app.kubernetes.io/name: golden-queue
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
    app: golden
    app.kubernetes.io/component: queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-queue
      app.kubernetes.io/instance: golden
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
      labels:
        helm.sh/chart: chart-0.1.0
        app.kubernetes.io/name: golden-queue
        app.kubernetes.io/instance: golden
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        app: golden
        app.kubernetes.io/component: queue
    spec:
      imagePullSecrets:
        - name: registry-credentials
      serviceAccountName: golden
      securityContext:
        fsGroup: 2000
      # queue:work finishes the job in hand on SIGTERM and then exits. Jobs here
      # send mail and talk to PayPal, so being killed part-way is worth avoiding.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: secrets
          secret:
            secretName: golden
        - name: mglogs-persistent-storage
          persistentVolumeClaim:
            claimName: mglogs
        - name: sqlite-databases
          emptyDir: {}
        - name: fast-logs
          emptyDir: {}
      initContainers:
        - name: migrate
          image: "registry.metager.de/open-source/metager/fpm:golden"
          command: ["/bin/sh", "-c"]
          args:
            - touch database/databases/database.sqlite && php artisan migrate --force
          env:
          - name: APP_ENV
            value: production
          
          - name: REDIS_HOST
            value: golden-valkey-master.metager.svc.cluster.local
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          
          - name: REDIS_SENTINEL_HOSTS
            value: golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local
          - name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_SERVICE
            value: mymaster
          - name: REDIS_PORT
            value: "6379"
          - name: REVERB_HOST
            value: metager.de
          - name: LOG_CHANNEL
            value: "stderr"
          - name: MATOMO_ENABLED
            value: "true"
          volumeMounts:
          - name: secrets
            mountPath: /metager/metager_app/.env
            subPath: ENV_PRODUCTION
            readOnly: true
          - name: mglogs-persistent-storage
            mountPath: /metager/metager_app/storage/metager
            readOnly: false
          - name: sqlite-databases
            mountPath: /metager/metager_app/database/databases
          - name: fast-logs
            mountPath: /metager/metager_app/storage/metager/fast_dir
      containers:
        - name: queue
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          image: "registry.metager.de/open-source/metager/fpm:golden"
          command: ["/usr/local/bin/php"]
          args: ["artisan", "queue:work", "--backoff=60", "--tries=5", "--sleep=1", "--queue=donations,default,general"]
          imagePullPolicy: IfNotPresent
          env:
          - name: APP_ENV
            value: production
          
          - name: REDIS_HOST
            value: golden-valkey-master.metager.svc.cluster.local
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          
          - name: REDIS_SENTINEL_HOSTS
            value: golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local
          - name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_SERVICE
            value: mymaster
          - name: REDIS_PORT
            value: "6379"
          - name: REVERB_HOST
            value: metager.de
          - name: LOG_CHANNEL
            value: "stderr"
          - name: MATOMO_ENABLED
            value: "true"
          volumeMounts:
          - name: secrets
            mountPath: /metager/metager_app/.env
            subPath: ENV_PRODUCTION
            readOnly: true
          - name: secrets
            mountPath: /metager/metager_app/config/sumas.json
            subPath: SUMAS_JSON
          - name: secrets
            mountPath: /metager/metager_app/config/suggestions.json
            subPath: SUGGESTIONS
          - name: secrets
            mountPath: /metager/metager_app/config/blacklistDomains.txt
            subPath: BLACKLIST_DOMAINS
          - name: secrets
            mountPath: /metager/metager_app/config/blacklistUrl.txt
            subPath: BLACKLIST_URL
          - name: secrets
            mountPath: /metager/metager_app/config/blacklistDescriptionUrl.txt
            subPath: BLACKLIST_DESCRIPTION_URL
          - name: mglogs-persistent-storage
            mountPath: /metager/metager_app/storage/metager
            readOnly: false
          - name: sqlite-databases
            mountPath: /metager/metager_app/database/databases
          - name: fast-logs
            mountPath: /metager/metager_app/storage/metager/fast_dir
          # Unchanged from the sidecar. pgrep only proves the process exists, not
          # that it is draining anything — but a queue worker has no equivalent of
          # the scheduler's heartbeat to check against, and inventing one is not
          # part of moving it between pods.
          livenessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          readinessProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          startupProbe:
            exec:
              command:
              - pgrep
              - -f
              - queue:work
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: golden-queue
                    app.kubernetes.io/instance: golden
                topologyKey: kubernetes.io/hostname
      tolerations:
        - effect: NoSchedule
          key: node-role
          operator: Equal
          value: web

