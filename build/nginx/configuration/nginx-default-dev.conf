resolver 127.0.0.11 valid=10s;

server {
    # Prepare header variables for use in proxy_pass locations
    set $header_host $host;
    if ($http_x_forwarded_host != "") {
        set $header_host $http_x_forwarded_host;
    }
    set $header_x_forwarded_for $http_x_forwarded_for;
    set $header_x_real_ip $http_x_real_ip;
    set $header_x_forwarded_proto $http_x_forwarded_proto;
    set $header_x_forwarded_host $http_x_forwarded_host;
    set $header_x_forwarded_port $http_x_forwarded_port;

    # Set defaults if headers are missing
    if ($http_x_forwarded_for = "") {
        set $header_x_forwarded_for $proxy_add_x_forwarded_for;
    }
    if ($http_x_real_ip = "") {
        set $header_x_real_ip $remote_addr;
    }
    if ($http_x_forwarded_proto = "") {
        set $header_x_forwarded_proto 'http';
    }
    if ($http_x_forwarded_host = "") {
        set $header_x_forwarded_host $http_host;
    }
    if ($http_x_forwarded_port = "") {
        set $header_x_forwarded_port 8080;
    }
    
    listen       8080;
    server_name  localhost;
    root   /metager/metager_app/public;
    index  index.php index.html index.htm;

    client_max_body_size 30M;


    #proxy_set_header Host $header_host;
    proxy_set_header X-Forwarded-For $header_x_forwarded_for;
    proxy_set_header X-Real-IP $header_x_real_ip;
    proxy_set_header X-Forwarded-Proto $header_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $header_x_forwarded_host;
    proxy_set_header X-Forwarded-Port $header_x_forwarded_port;

    location ~ web.config$ {
        return 404 "Not Found";
    }
    location ~ \.htaccess$ {
        return 404 "Not Found";
    }

    location /health-check/nginx {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # See nginx-default.conf for why this proxies to FPM's own ping handler
    # instead of a Laravel route.
    location = /health-check/liveness {
        set $fpm_server fpm;
        access_log off;
        fastcgi_pass $fpm_server:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
    }

    # Match /keys, /de-DE/keys, /keys/cost, etc., but NOT /proxy or /proxy/*
    location ~ "^(/[^/]+)?/keys(/.*)?$" {
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        proxy_pass http://192.168.5.100:3000; # IP Adress is statically set in keymanager project for dev
    }


    # HMR WebSocket for webpack-dev-server
    location ^~ /proxy/ws {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://192.168.5.200:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # VNC WebSocket endpoint for noVNC
    location ^~ /proxy/browser-streaming {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://192.168.5.201:3000/proxy/browser-streaming;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
    }

    # Audio WebSocket endpoint for noVNC
    location ^~ /proxy/browser-audio {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://192.168.5.201:3000/proxy/browser-audio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
    }

    # Touch input WebSocket endpoint (touch-mode sessions on phones/tablets)
    location ^~ /proxy/browser-touch {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://192.168.5.201:3000/proxy/browser-touch;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
    }

    # App WebSocket endpoint
    location ^~ /proxy/browser-session {
        proxy_pass http://192.168.5.201:3000/proxy/browser-session;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Match /proxy, /de-DE/proxy, /proxy/abc, etc., but NOT /keys or /keys/*
    location ~ "^(/[^/]+)?/proxy(/.*)?$" {
        add_header X-Debug-Location proxy-regex;
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        proxy_pass http://192.168.5.200:3001; # IP Adress is statically set in Browser manager project for dev
    }

    # Handle websocket connections
    # The Websocket Client/Laravel Echo would connect and listen to this
    #
    # `set` before `rewrite ... break`, and the upstream named through the
    # variable, are both load-bearing:
    #
    #   - A literal `proxy_pass http://reverb:8080` is resolved once, when the
    #     config is loaded, and pinned for the life of the worker. Compose
    #     hands out container IPs in start order, so recreating the app
    #     containers without recreating nginx moves reverb and leaves nginx
    #     dialling whatever container inherited the old address. That is a 502
    #     on every websocket *and* on every broadcast the backend POSTs to
    #     /apps/{id}/events, while the site itself keeps working -- so it reads
    #     as a broken Reverb rather than as stale DNS. Naming the host through
    #     a variable sends it through the `resolver` at the top of this file
    #     instead, which re-resolves every 10s.
    #   - The literal form also created an implicit upstream group called
    #     "reverb:8080", which the variable form in the /apps/{id}/events block
    #     below found by name and reused -- so that block inherited the pinned
    #     address too, and broadcasting broke along with the socket.
    #   - `break` ends the rewrite phase, and `set` is a rewrite-phase
    #     directive. Below the rewrite it never runs, the variable is empty,
    #     and nginx answers 500 with "no host in upstream".
    location /ws/app {
        set $reverb_upstream reverb;
        rewrite /ws/(.*) /$1  break;
        proxy_http_version 1.1;
        proxy_set_header Host $header_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://$reverb_upstream:8080;
    }

    # The Laravel Backend would broadcast to this
    location ~ ^/apps/(?<reverbid>[^/]+)/events$ { # variable reverbid
        set $reverb_server reverb;
        proxy_set_header Host $header_host;
        proxy_pass http://$reverb_server:8080/apps/$reverbid/events$is_args$args;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }


    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header "Content-Security-Policy" $csp;
    }

    location ~ \.php$ {
        set $fpm_server fpm;
        try_files $uri /index.php =404;
        fastcgi_buffer_size    256k;
        fastcgi_buffers     32 256k;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $fpm_server:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 900;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fastcgi_param HTTP_HOST $header_host;
        include fastcgi_params;
        add_header "Content-Security-Policy" $csp;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}