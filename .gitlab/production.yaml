ingress:
  hosts:
    - host: metager.de
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.metager.de
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: metager2.de
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.metager2.de
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: metager.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.metager.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: metager.es
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.metager.es
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: metager.nl
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.metager.nl
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: metager.co.uk
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: www.metager.co.uk
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - metager.de
        - www.metager.de
        - metager2.de
        - www.metager2.de
        - metager.org
        - www.metager.org
        - metager.es
        - www.metager.es
        - metager.nl
        - www.metager.nl
        - metager.co.uk
        - www.metager.co.uk
      secretName: production-tls

# Gateway API parity, off until verified via review apps and development
# first -- see chart/values.yaml. Only metager.de and metager.org serve
# real content; every other host here 301s to one of those two (see
# redirects below), replicating the ingress.annotations
# configuration-snippet's `if ($host = ...)` block above. hosts[0] is set
# at deploy time (update_deployment.sh --set gatewayAPI.hosts[0]) but is
# already metager.de here, so that's a no-op for production.
gatewayAPI:
  enabled: false
  hosts:
    - metager.de
    - metager.org
  redirects:
    - host: www.metager.de
      toHost: metager.de
    - host: metager2.de
      toHost: metager.de
    - host: www.metager2.de
      toHost: metager.de
    - host: www.metager.org
      toHost: metager.org
    - host: metager.es
      toHost: metager.org
      toPathPrefix: /es-ES/
    - host: www.metager.es
      toHost: metager.org
      toPathPrefix: /es-ES/
    - host: metager.nl
      toHost: metager.org
      toPathPrefix: /nl-NL/
    - host: www.metager.nl
      toHost: metager.org
      toPathPrefix: /nl-NL/
    - host: metager.co.uk
      toHost: metager.org
      toPathPrefix: /en-GB/
    - host: www.metager.co.uk
      toHost: metager.org
      toPathPrefix: /en-GB/

autoscaling:
  minReplicas: 2

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

resources:
  requests:
    fpm:
      cpu: 1
      memory: 500M
    scheduler:
      cpu: 50m
      memory: 50M
    worker:
      cpu: 1
      memory: 100M
    queue:
      cpu: 50m
      memory: 50M
    nginx:
      cpu: 100m
      memory: 100M
    reverb:
      cpu: 50m
      memory: 50M

env:
  # GlitchTip (self-hosted, Sentry-protocol-compatible). The DSN is a public
  # identifier by design -- it ships in client-side JS regardless -- so it lives
  # here rather than in the ENV_PRODUCTION secret. Not set in review.yaml on
  # purpose: review apps are short-lived and would just add noise to project 36.
  SENTRY_LARAVEL_DSN: https://ada7fd926fac4b36b83c1292a95ec14f@errors.metager.de/36
  SENTRY_TRACES_SAMPLE_RATE: "0.01"
