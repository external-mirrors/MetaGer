ingress:
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns
  hosts:
    - paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - "*.review.metager.de"
      secretName: review-tls

autoscaling:
  enabled: false

env:
  DB_CONNECTION: sqlite
  REDIS_CACHE_CONNECTION: default
  REDIS_CACHE_LOCK_CONNECTION: default
  REDIS_SESSION_CONNECTION: default
  SESSION_CONNECTION: default

# One of everything, same as development.yaml: the chart defaults are sized for
# production and a review app is a single-user throwaway deployment.
queue:
  replicaCount: 1

reverb:
  replicaCount: 1

valkey:
  replicaCount: 1
  sentinel:
    quorum: 1
  # See development.yaml: the base chart's minAvailable: 2 is sized for
  # production and does not move with replicaCount, so a single pod can
  # never satisfy it and a node drain hits an unclearable PDB.
  pdb:
    enabled: false
