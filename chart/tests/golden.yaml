    # Websockets are idle for long stretches by design; the app's activity_timeout
    # is 30s and its ping_interval 60s, so anything shorter than that here would
    # cut healthy connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "metager.de"
      secretName: metager-tls
  rules:
    - host: "metager.de"
      http:
        paths:
          - path: /ws(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: golden-reverb
                port:
                  number: 8081

