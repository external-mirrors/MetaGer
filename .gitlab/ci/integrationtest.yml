.test_base:
  tags:
    - kubernetes
  stage: integrationtest
  image:
    name: ${CI_REGISTRY_IMAGE}/$DOCKER_FPM_IMAGE_NAME:$DOCKER_FPM_IMAGE_TAG
    entrypoint: ["/bin/bash"]
  variables:
    BRANCH_NAME: $CI_COMMIT_REF_NAME
    COMMIT_NAME: $CI_COMMIT_REF_SLUG
    MATOMO_ENABLED: false
    # phpunit.xml declares these for the test run, but `php artisan optimize` bakes the production
    # .env into bootstrap/cache/config.php and cached config is never re-read through env() — so
    # the phpunit values are silently ignored and the tests reach for the production Redis
    # sentinel, unreachable from CI. Set them as real job variables instead: Laravel's dotenv is
    # immutable, so they win over .env and land in the config cache itself.
    CACHE_STORE: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
    # Not every Redis call goes through the cache. SchedulerHeartbeat reads the stamp with
    # Redis::get, and the search path will block on Redis::brpop, so an array cache store
    # does not make the suite Redis-free — it only hides which parts still need one. Point
    # the default connection at the service below; the .env copied in leaves REDIS_HOST at
    # localhost, which is why this failed with "Connection refused [tcp://127.0.0.1:6379]".
    REDIS_HOST: redis
  # Every rendered page resolves its stylesheets and scripts through the Vite manifest, and
  # Vite::asset() throws when public/build/manifest.json is absent — so the feature tests need
  # the built frontend, not just vendor/. Pull the npm job's artifact; composer still runs in
  # before_script because these jobs need the dev dependencies the composer job omits.
  #
  # `dependencies` and not `needs`: needs would also rewire *when* these jobs run, releasing
  # them from stage order to start the moment npm finishes — before the fpm image they run on
  # has been built, and before the review environment browsertest points at exists.
  # `dependencies` alone only selects which artifacts to download.
  dependencies:
    - npm
  before_script:
    - export COMPOSER_HOME=$(pwd)/metager/.composer
    - cd metager
    - cp $ENV_PRODUCTION .env
    # config/sumas.json is gitignored (it only ever carries API secrets), so a fresh checkout has
    # none, and anything that boots SearchEngineRegistry fatals without it. In a deployed pod the
    # fpm image's entrypoint falls back to the example file for exactly this reason, but this job
    # replaces that entrypoint with bash, so do the same thing here.
    - test -f config/sumas.json || cp config/sumas.json.example config/sumas.json
    - composer install
    - php artisan optimize
  cache:
    paths:
      - metager/.composer/
  except:
    refs:
      - master

# Unit + Feature suites. phpunit.xml deliberately excludes tests/Browser, so this job
# needs no browser and no Selenium service — it is the fast gate that should stay fast.
#
# Unlike browsertest it runs entirely inside its own container, against nothing deployed,
# so it does not have to wait out the deploy stage: it needs the npm build and the image
# it runs on, and nothing else.
test:
  extends: .test_base
  needs:
    - npm
    - fpm
  # Same image as docker-compose runs locally, so a test that passes on a laptop passes here.
  services:
    - name: redis:8.10
      alias: redis
  script:
    - php artisan test --without-tty

# Dusk browser suite (phpunit.dusk.xml). Split out from `test` because it is the only
# part of the suite that needs a real browser; keeping it separate means a Selenium
# outage can no longer fail the unit tests.
#
# No `needs` here on purpose. Dusk's base URL is config('app.url'), which the pipeline sets
# to the review environment — so this job browses the deployment made in the previous stage
# and has to stay behind it in stage order.
browsertest:
  extends: .test_base
  # `extends` replaces list values rather than merging them, so redis has to be repeated
  # here — leaving it out would silently take it away from this job alone.
  services:
    - name: selenium/standalone-firefox:153.0
      alias: selenium-standalone-firefox
    - name: redis:8.10
      alias: redis
  variables:
    SELENIUM_HOST: selenium-standalone-firefox
    # The Dusk tests derive their expected URLs from `app.locale`, which the config cache
    # freezes at the value LaravelLocalization resolved while building it (en-US, matching
    # Selenium Firefox's Accept-Language). So do not add `config:clear` here — it drops the
    # locale to config/app.php's literal 'default' and breaks the plugin and sitesearch tests.
  script:
    - php artisan dusk --without-tty
