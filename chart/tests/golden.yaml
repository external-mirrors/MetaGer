data:
  valkey.conf: |
    # Valkey configuration file
    
    # Network
    bind 0.0.0.0
    port 6379
    
    # General
    daemonize no
    supervised no
    
    # Logging
    loglevel notice
    logfile ""
    
    # Persistence
    dir /data
    save ""
    
    # Memory management
    maxmemory 5gb
    maxmemory-policy allkeys-lru
    
    # Security
    protected-mode yes
    
    # Additional configuration
    appendonly no
    repl-diskless-sync-delay 5
    repl-diskless-sync-max-replicas 2
    repl-diskless-load swapdb
    repl-timeout 120
    repl-backlog-size 512mb
    shutdown-timeout 10

