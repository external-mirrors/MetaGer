# Chart checks. These run before anything is built or deployed: a broken template
# should not cost a full image build to discover.
chart:
  stage: build_dependency_images
  # Not DEPLOY_KUBERNETES_IMAGE, which carries helm 3.18. The golden snapshot no
  # longer depends on that (render.sh drops the blank lines around `---` that were
  # the only difference between helm 3 and 4), but a pinned helm keeps any other
  # change a helm release makes showing up as one reviewable Renovate bump.
  # tests/render.sh reads this tag as the helm the snapshot is meant for, so it is
  # the one place the version lives.
  # The deploy jobs keep their own image — swapping the helm that performs real
  # upgrades is a separate decision from the one that renders a test.
  image:
    name: alpine/helm:4.3.1
    entrypoint: [""]
  tags:
    - kubernetes
  needs: []
  script:
    - cd chart
    # render.sh's own tests, with helm stubbed: whether it fetches the subchart is
    # what decides if the golden check below can run at all. See tests/render_test.sh.
    - ./tests/render_test.sh
    # Golden-file check. `helm template` output is compared against tests/golden.yaml,
    # so a chart change has to state what it changes in the manifests. See tests/render.sh.
    #
    # It runs before lint because chart/charts/*.tgz is gitignored — the subchart
    # comes from the Helm registry named in Chart.yaml — so a fresh checkout has no
    # dependencies at all, and render.sh is what fetches them. Linting first would
    # only report them as missing.
    - ./tests/render.sh
    # Named assertions about the manifests the golden diff cannot make for you:
    # which Service REDIS_HOST resolves to, that every secretKeyRef names a key
    # that exists, that Sentinel is actually enabled, and that the 48-char valkey
    # name budget still holds. See tests/assertions.sh for why each one matters.
    - ./tests/assertions.sh
    - helm lint . --values tests/golden-values.yaml
  rules:
    - changes:
        - chart/**/*
