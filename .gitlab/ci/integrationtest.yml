.test_base:
  tags:
    - kubernetes
  stage: integrationtest
  image:
    name: ${CI_REGISTRY_IMAGE}/$DOCKER_FPM_IMAGE_NAME:$DOCKER_FPM_IMAGE_TAG
    entrypoint: ["/bin/bash"]
  variables:
    BRANCH_NAME: $CI_COMMIT_REF_NAME
    COMMIT_NAME: $CI_COMMIT_REF_SLUG
    MATOMO_ENABLED: false
    # phpunit.xml declares these for the test run, but `php artisan optimize` bakes the production
    # .env into bootstrap/cache/config.php and cached config is never re-read through env() — so
    # the phpunit values are silently ignored and the tests reach for the production Redis
    # sentinel, unreachable from CI. Set them as real job variables instead: Laravel's dotenv is
    # immutable, so they win over .env and land in the config cache itself.
    CACHE_STORE: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
  dependencies: [] # No artifacts required
  before_script:
    - export COMPOSER_HOME=$(pwd)/metager/.composer
    - cd metager
    - cp $ENV_PRODUCTION .env
    # config/sumas.json is gitignored (it only ever carries API secrets), so a fresh checkout has
    # none, and anything that boots SearchEngineRegistry fatals without it. In a deployed pod the
    # fpm image's entrypoint falls back to the example file for exactly this reason, but this job
    # replaces that entrypoint with bash, so do the same thing here.
    - test -f config/sumas.json || cp config/sumas.json.example config/sumas.json
    - composer install
    - php artisan optimize
  cache:
    paths:
      - metager/.composer/
  except:
    refs:
      - master

# Unit + Feature suites. phpunit.xml deliberately excludes tests/Browser, so this job
# needs no browser and no Selenium service — it is the fast gate that should stay fast.
test:
  extends: .test_base
  script:
    - php artisan test --without-tty

# Dusk browser suite (phpunit.dusk.xml). Split out from `test` because it is the only
# part of the suite that needs a real browser; keeping it separate means a Selenium
# outage can no longer fail the unit tests.
browsertest:
  extends: .test_base
  services:
    - name: selenium/standalone-firefox:114.0
      alias: selenium-standalone-firefox
  variables:
    SELENIUM_HOST: selenium-standalone-firefox
    # The Dusk tests derive their expected URLs from `app.locale`, which the config cache
    # freezes at the value LaravelLocalization resolved while building it (en-US, matching
    # Selenium Firefox's Accept-Language). So do not add `config:clear` here — it drops the
    # locale to config/app.php's literal 'default' and breaks the plugin and sitesearch tests.
  script:
    - php artisan dusk --without-tty
