server {
    listen       8080;
    server_name  localhost;
    root   /metager/metager_app/public;
    index  index.php index.html index.htm;

    client_max_body_size 30M;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto 'https';
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    location ~ web.config$ {
        return 404 "Not Found";
    }
    location ~ \.htaccess$ {
        return 404 "Not Found";
    }

    location /health-check/nginx { 
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location ~ "^(/.*)?/keys" {
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        proxy_pass http://keymanager-main.keymanager:80; # IP Adress is statically set in keymanager project for dev
    }

    # Match /chat, /de-DE/chat, /chat/api/..., etc.
    # NOTE: metager-chat has no streaming endpoint yet (see docs/llm/metager-chat-service/
    # architecture.md). Once one exists, give it its own ^~ block ahead of this one with
    # proxy_read_timeout raised and proxy_buffering off, mirroring /proxy/browser-streaming below.
    location ~ "^(/[^/]+)?/chat(/.*)?$" {
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        # Locale is deliberately NOT derived from this path segment — see the decision in
        # metager-chat/docs/planning/locale-awareness.md. This strip only keeps /chat reachable
        # identically whether hit directly or through any MetaGer locale prefix.
        rewrite "^/[^/]+(/chat.*)$" $1 break;
        proxy_pass http://chat-master.chat:80; # Helm release "chat-master" in the "chat" namespace
    }

        # HMR WebSocket for webpack-dev-server
    location ^~ /proxy/ws {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/ws;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # VNC WebSocket endpoint for noVNC
    location ^~ /proxy/browser-streaming {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-streaming;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Audio WebSocket endpoint for noVNC
    location ^~ /proxy/browser-audio {
        add_header X-Debug-Location proxy-ws;
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-audio;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # App WebSocket endpoint
    location ^~ /proxy/browser-session {
        proxy_pass http://master-safebrowse.safebrowse/proxy/browser-session;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Match /proxy, /de-DE/proxy, /proxy/abc, etc., but NOT /keys or /keys/*
    location ~ "^(/[^/]+)?/proxy(/.*)?$" {
        add_header X-Debug-Location proxy-regex;
        access_log off;
        proxy_buffer_size    256k;
        proxy_buffers     32 256k;
        proxy_pass http://master-safebrowse.safebrowse; # IP Adress is statically set in Browser manager project for dev
    }

    # Handle websocket connections
    # The Websocket Client/Laravel Echo would connect and listen to this
    location /ws/app {
        rewrite /ws/(.*) /$1  break;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_pass http://127.0.0.1:8081;
    }

        # The Laravel Backend would broadcast to this
    location ~ ^/apps/(?<reverbid>[^/]+)/events$ { # variable reverbid
        proxy_pass http://127.0.0.1:8081/apps/$reverbid/events$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header "Content-Security-Policy" $csp;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_buffer_size    256k;
        fastcgi_buffers     32 256k;
        fastcgi_pass localhost:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 900;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        add_header "Content-Security-Policy" $csp;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}