apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-reverb
  labels:
    helm.sh/chart: chart-0.1.0
    app.kubernetes.io/name: golden-reverb
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
    app: golden
    app.kubernetes.io/component: reverb
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-reverb
      app.kubernetes.io/instance: golden
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
      labels:
        helm.sh/chart: chart-0.1.0
        app.kubernetes.io/name: golden-reverb
        app.kubernetes.io/instance: golden
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        app: golden
        app.kubernetes.io/component: reverb
    spec:
      imagePullSecrets:
        - name: registry-credentials
      serviceAccountName: golden
      securityContext:
        fsGroup: 2000
      # These are long-lived websockets. On a rollout the pod stops accepting new
      # connections immediately, but existing clients should be given time to
      # finish rather than being cut mid-session; the extension reconnects, so this
      # is about avoiding a thundering reconnect, not about correctness.
      terminationGracePeriodSeconds: 300
      volumes:
        - name: secrets
          secret:
            secretName: golden
        - name: mglogs-persistent-storage
          persistentVolumeClaim:
            claimName: mglogs
        - name: sqlite-databases
          emptyDir: {}
        - name: fast-logs
          emptyDir: {}
      containers:
        - name: reverb
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          image: "registry.metager.de/open-source/metager/fpm:golden"
          command: ["/usr/local/bin/php"]
          args: ["artisan", "reverb:start", "--port=8081"]
          imagePullPolicy: IfNotPresent
          env:
          - name: APP_ENV
            value: production
          
          - name: REDIS_HOST
            value: golden-valkey-master.metager.svc.cluster.local
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          
          - name: REDIS_SENTINEL_HOSTS
            value: golden-valkey-0.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-1.golden-valkey-headless.metager.svc.cluster.local,golden-valkey-2.golden-valkey-headless.metager.svc.cluster.local
          - name: REDIS_SENTINEL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-valkey
                key: password
          - name: REDIS_SENTINEL_SERVICE
            value: mymaster
          - name: REDIS_PORT
            value: "6379"
          - name: REVERB_HOST
            value: metager.de
          - name: LOG_CHANNEL
            value: "stderr"
          - name: MATOMO_ENABLED
            value: "true"
          # The point of the exercise. config/reverb.php already reads this and
          # already has the Redis connection under it; it was simply never on.
          - name: REVERB_SCALING_ENABLED
            value: "true"
          volumeMounts:
          - name: secrets
            mountPath: /metager/metager_app/.env
            subPath: ENV_PRODUCTION
            readOnly: true
