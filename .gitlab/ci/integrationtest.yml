integrationtest:
  services:
    - name: selenium/standalone-firefox:114.0
      alias: selenium-standalone-firefox
  tags:
    - kubernetes
  stage: integrationtest
  image:
    name: ${CI_REGISTRY_IMAGE}/$DOCKER_FPM_IMAGE_NAME:$DOCKER_FPM_IMAGE_TAG
    entrypoint: ["/bin/bash"]
  variables:
    BRANCH_NAME: $CI_COMMIT_REF_NAME
    COMMIT_NAME: $CI_COMMIT_REF_SLUG
    SELENIUM_HOST: selenium-standalone-firefox
    MATOMO_ENABLED: false
  dependencies: [] # No artifacts required
  before_script:
    - export COMPOSER_HOME=$(pwd)/metager/.composer
  script:
    # Install Dev Dependencies
    - cd metager
    - cp $ENV_PRODUCTION .env
    # config/sumas.json is gitignored (it only ever carries API secrets), so a fresh checkout has
    # none, and anything that boots SearchEngineRegistry fatals without it. In a deployed pod the
    # fpm image's entrypoint falls back to the example file for exactly this reason, but this job
    # replaces that entrypoint with bash, so do the same thing here.
    - test -f config/sumas.json || cp config/sumas.json.example config/sumas.json
    - composer install
    - php artisan optimize
    - php artisan test --without-tty
  cache:
    paths:
      - metager/.composer/
  except:
    refs:
      - master
