access.log = /dev/null

; This File holds custom www pool configurations
[www]
; Limit requests to 30 seconds
request_terminate_timeout = 30
pm.max_children = 100
pm.start_servers = 10
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500

; Answered by the worker that picks up the connection, before it bootstraps
; Laravel — no Redis, no Postgres, no service-provider code runs at all. The
; liveness/readiness probe (nginx-default.conf's /health-check/liveness,
; proxied here) used to boot the full framework for no reason, which meant a
; probe could fail for reasons that have nothing to do with whether the pod
; can serve traffic. It does still need a free worker like any other
; request, so it is not a bypass of pm.max_children exhaustion by itself —
; config/database.php's pgsql PDO::ATTR_TIMEOUT is what bounds how long a
; DB-touching request can hold one of those workers hostage.
ping.path = /fpm-ping
ping.response = pong