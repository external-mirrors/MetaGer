{{- if .Values.gatewayAPI.enabled -}}
{{/*
Gateway API HTTPRoute for MetaGer's alias/redirect-only hosts (the old
Ingress's configuration-snippet `if ($host = ...) { return 301 ...; }`
block) — www.metager.de, the metager2.de variants, and the four
locale-alias domains that 301 to a path under metager.org. Only used in
production; .gitlab/production.yaml is the only values file that sets
gatewayAPI.redirects.

toPathPrefix MUST end in a trailing slash (e.g. `/es-ES/`, not `/es-ES`).
Verified empirically against a disposable test HTTPRoute before trusting
this: nginx's old `return 301 https://metager.org/es-ES$request_uri;` is a
plain string concat where $request_uri supplies its own leading slash, but
Gateway API's ReplacePrefixMatch strips the matched "/" prefix first and
then prepends the replacement verbatim -- without the trailing slash,
`/foo/bar` becomes `/es-ESfoo/bar` (no separator), not `/es-ES/foo/bar`.
*/}}
{{- $fullName := include "chart.fullname" . -}}
{{- $root := . -}}
{{- range .Values.gatewayAPI.redirects }}
{{- $sectionName := .host | replace "." "-" -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-{{ $sectionName }}-redirect
  labels:
    {{- include "chart.labels" $root | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $root.Values.gatewayAPI.gatewayName }}
      namespace: {{ $root.Values.gatewayAPI.gatewayNamespace }}
      sectionName: {{ $sectionName }}
  hostnames:
    - {{ .host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .toHost }}
            statusCode: 301
            {{- if .toPathPrefix }}
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .toPathPrefix }}
            {{- end }}
{{- end }}
{{- end }}
